name: Build single binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Linux ${{ matrix.arch }} static binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: start_server-x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: start_server-aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binary
        run: cargo build --locked --release --bin start_server --target "${TARGET}"

      - name: Prepare binary
        run: |
          cp "target/${TARGET}/release/start_server" "${BINARY_NAME}"
          chmod 755 "${BINARY_NAME}"

      - name: Verify binary
        run: |
          if readelf -d "${BINARY_NAME}" | grep -q NEEDED; then
            echo "${BINARY_NAME} has dynamic library dependencies" >&2
            exit 1
          fi
          "./${BINARY_NAME}" --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          archive: false
          if-no-files-found: error

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.BINARY_NAME }}
          generate_release_notes: true

  build-macos:
    name: macOS universal binary
    runs-on: macos-latest
    env:
      BINARY_NAME: start_server-macos-universal

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build release binaries
        run: |
          cargo build --locked --release --bin start_server --target x86_64-apple-darwin
          cargo build --locked --release --bin start_server --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/start_server \
            target/aarch64-apple-darwin/release/start_server \
            -output "${BINARY_NAME}"
          chmod 755 "${BINARY_NAME}"

      - name: Verify binary
        run: |
          test "$(lipo -archs "${BINARY_NAME}")" = "x86_64 arm64"
          "./${BINARY_NAME}" --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          archive: false
          if-no-files-found: error

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.BINARY_NAME }}
          generate_release_notes: true
